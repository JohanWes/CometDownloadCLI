plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.chaquo.python"
}

android {
    namespace "com.johanwes.cometdownload"
    compileSdk 36

    defaultConfig {
        applicationId "com.johanwes.cometdownload"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "1.0.1"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.13"
            def localPython313 = "${System.getProperty("user.home")}/.local/share/uv/python/cpython-3.13-linux-x86_64-gnu/bin/python3.13"
            buildPython System.getenv("CHAQUOPY_BUILD_PYTHON") ?: (file(localPython313).exists() ? localPython313 : "python3.13")
            pip {
            }
        }
    }

    def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            // Two annotation-only libraries ship the same OSGi manifest; neither is needed at runtime.
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.05.00")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "io.coil-kt:coil-compose:2.7.0"

    // In-app player: Media3 (ExoPlayer) with FFmpeg decoders for what the device can't decode.
    def media3 = "1.11.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-ui-compose:$media3"
    implementation "io.github.anilbeesetti:nextlib-media3ext:$media3-0.18.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
